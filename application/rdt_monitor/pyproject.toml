[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rdt-monitor"
version = "0.1.0"
description = "Unqualified replay-first desktop monitor for RDT reliability experiments"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "PyQt6>=6.7,<7",
]

[project.optional-dependencies]
inference = ["openvino>=2025,<2027"]

[project.scripts]
rdt-monitor = "rdt_monitor.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.hatch.build.targets.wheel]
packages = ["src/rdt_monitor"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"../../tools/keyence_nr_cm01_api.py" = "shared/keyence_nr_cm01_api.py"